name: Build KirayaKhata APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release tag when triggered manually (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT; relying on pre-installed licenses"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore & Optional Google Services Config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] && [ ! -f "app/google-services.json" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "CLEANUP_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build Signed APK
        id: build_apk
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_LABEL="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            VERSION_LABEL="$INPUT_RELEASE_TAG"
          else
            VERSION_LABEL="build-${GITHUB_RUN_NUMBER}"
          fi

          STORE_PASSWORD=$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '\r\n')
          if [ -z "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            KEY_PASSWORD="$STORE_PASSWORD"
          fi

          if [ -n "$RAW_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Decoding release upload keystore..."
            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            printf '%s' "$RAW_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Could not open my-upload-key.jks with STORE_PASSWORD. Check RELEASE_KEYSTORE_BASE64 and STORE_PASSWORD secrets."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              FOUND_ALIAS=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F',' '/PrivateKeyEntry/{print $1; exit}')
              if [ -n "$FOUND_ALIAS" ]; then
                echo "::notice::Keystore did not contain alias 'upload'; found alias '$FOUND_ALIAS' and mapping it to 'upload' for this build."
                keytool -changealias -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$FOUND_ALIAS" -destalias upload -keypass "$KEY_PASSWORD"
              else
                echo "::error::No PrivateKeyEntry found inside my-upload-key.jks. Regenerate with -alias upload."
                exit 1
              fi
            fi

            export STORE_PASSWORD
            export KEY_PASSWORD
            gradle :app:assembleRelease --no-daemon --console=plain
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="KirayaKhata-${VERSION_LABEL}.apk"
            cp "$APK_SRC" "dist/${APK_NAME}"
            echo "build_kind=release" >> "$GITHUB_OUTPUT"
            echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured yet. Building debug-signed preview APK instead. See BUILD_AND_GITHUB_APK.md to enable signed release APKs."
            gradle :app:assembleDebug --no-daemon --console=plain
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="KirayaKhata-${VERSION_LABEL}-debug.apk"
            cp "$APK_SRC" "dist/${APK_NAME}"
            echo "build_kind=debug" >> "$GITHUB_OUTPUT"
            echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.apk_name }}
          path: dist/*.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag_name }}
          name: KirayaKhata ${{ steps.build_apk.outputs.tag_name }}
          prerelease: ${{ steps.build_apk.outputs.build_kind != 'release' }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            Automated KirayaKhata Android APK build (${{ steps.build_apk.outputs.build_kind }}).

            Install on Android: Download the `.apk` file below and tap to install.

      - name: Clean up temporary credentials
        if: always()
        run: |
          rm -f "${{ github.workspace }}/my-upload-key.jks" debug.keystore
          if [ "${CLEANUP_GOOGLE_SERVICES:-false}" = "true" ]; then
            rm -f app/google-services.json
          fi
